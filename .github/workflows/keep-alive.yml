name: Keep Session Alive

on:
  # Run every 2 hours to prevent session token idle expiry
  # The session expires after ~8-12h of inactivity
  schedule:
    - cron: '0 */2 * * *'

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Appspace API
        env:
          APPSPACE_SESSION_TOKEN: ${{ secrets.APPSPACE_SESSION_TOKEN }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Accept: application/json" \
            -H "token: $APPSPACE_SESSION_TOKEN" \
            "https://disney.cloud.appspace.com/api/v3/users/me")

          echo "API response: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "✓ Session is alive"
            exit 0
          fi

          echo "❌ Session is dead (HTTP $STATUS)"
          echo "   The local cron job should recover this automatically."
          echo "   If not, run: python refresh_token.py --headed"
          exit 1
