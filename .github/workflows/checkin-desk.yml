name: Check In to Desk

on:
  # Run at 9:00 AM Eastern Time, Monday-Thursday
  # Scheduled early to handle GitHub Actions cron delays (can be 20-45+ min late)
  # Script will wait until 9:15 AM when check-in window opens
  # Check-in window: 9:15 AM - 9:45 AM ET (15 min before/after 9:30 AM start)
  # Two entries to handle DST:
  #   EST (Nov-Mar): 9:00 AM ET = 14:00 UTC
  #   EDT (Mar-Nov): 9:00 AM ET = 13:00 UTC
  schedule:
    - cron: '0 14 * * 1-4'  # 9:00 AM EST (Nov-Mar), Mon-Thu
    - cron: '0 13 * * 1-4'  # 9:00 AM EDT (Mar-Nov), Mon-Thu

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check in to desk
        id: checkin
        env:
          APPSPACE_SESSION_TOKEN: ${{ secrets.APPSPACE_SESSION_TOKEN }}
          APPSPACE_REFRESH_TOKEN: ${{ secrets.APPSPACE_REFRESH_TOKEN }}
        run: |
          python book_desk.py --checkin

      - name: Persist refreshed tokens
        if: always() && steps.checkin.outputs.tokens_refreshed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set APPSPACE_SESSION_TOKEN --repo "${{ github.repository }}" --body "${{ steps.checkin.outputs.session_token }}"
          gh secret set APPSPACE_REFRESH_TOKEN --repo "${{ github.repository }}" --body "${{ steps.checkin.outputs.refresh_token }}"
          echo "✓ Refreshed tokens persisted to GitHub Secrets"

      - name: Summary
        if: always()
        run: |
          echo "## ✅ Desk Check-In Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Desk**: 08W-125-G (7 Hudson, 8th Floor)" >> $GITHUB_STEP_SUMMARY
          echo "- **Scheduled**: 9:00 AM ET" >> $GITHUB_STEP_SUMMARY
          echo "- **Actual run**: $(TZ='America/New_York' date '+%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check-in window: 9:15 AM - 9:45 AM ET (Appspace enforced)" >> $GITHUB_STEP_SUMMARY
