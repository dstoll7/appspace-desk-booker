name: Check In to Desk

on:
  # Scheduled EARLY (8:00 AM ET). GitHub's scheduled cron is routinely 30-60+ min
  # late, and the Appspace check-in window is only 9:15-9:45 AM ET. The job first
  # waits for the window to open, then checks in — so even a delayed run lands
  # inside the window. Fully unattended: a fresh session token is minted from the
  # long-lived refresh token over plain HTTP (no browser/Okta/login).
  # Two entries to handle DST:
  #   EST (Nov-Mar): 8:00 AM ET = 13:00 UTC
  #   EDT (Mar-Nov): 8:00 AM ET = 12:00 UTC
  schedule:
    - cron: '0 13 * * 1-4'  # 8:00 AM EST (Nov-Mar), Mon-Thu
    - cron: '0 12 * * 1-4'  # 8:00 AM EDT (Mar-Nov), Mon-Thu

  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger (optional)'
        required: false
        default: 'manual check-in'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checkin:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.1

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Wait for check-in window
        run: python book_desk.py --wait-for-checkin-window

      - name: Check in to desk
        id: checkin
        env:
          APPSPACE_REFRESH_TOKEN: ${{ secrets.APPSPACE_REFRESH_TOKEN }}
        run: |
          set +e
          python book_desk.py --checkin
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit $CODE

      # Exit code 2 from book_desk.py == auth failure (refresh token expired/revoked).
      # Other failures (e.g. past-window 500) must NOT open a reauth issue.
      - name: Alert if refresh token expired
        if: always() && steps.checkin.outputs.code == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "token-expired" --color "B60205" \
            --description "Appspace refresh token expired — yearly re-auth needed" \
            --repo ${{ github.repository }} 2>/dev/null || true
          EXISTING=$(gh issue list --label "token-expired" --state open \
            --json number --repo ${{ github.repository }} -q '.[0].number' 2>/dev/null)
          if [ -z "$EXISTING" ]; then
            BODY="Check-in failed. If the log shows AUTH FAILURE, the refresh token expired or was revoked (it lasts ~365 days).\n\nRun once locally to mint a new one:\n\`\`\`\ncd ~/Documents/GitHub/appspace-desk-booker\npython refresh_token.py\n\`\`\`\nApprove the Okta push. The script stores a fresh APPSPACE_REFRESH_TOKEN and everything is unattended again for another year."
            gh issue create \
              --title "Appspace refresh token expired — yearly re-auth required" \
              --label "token-expired" --repo ${{ github.repository }} --body "$BODY"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## ✅ Desk Check-In Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Desk**: 08W-125-G (7 Hudson, 8th Floor)" >> $GITHUB_STEP_SUMMARY
          echo "- **Scheduled**: 8:00 AM ET (waits for the 9:15-9:45 window)" >> $GITHUB_STEP_SUMMARY
          echo "- **Actual run**: $(TZ='America/New_York' date '+%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY
