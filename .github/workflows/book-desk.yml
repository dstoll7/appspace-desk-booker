name: Book Desk Daily

on:
  # Run at 11:00 PM ET, Monday-Thursday (to book 7 days out for Mon-Thu)
  # Running at 11 PM instead of midnight to beat other automated bookers.
  # The job mints a fresh token on-demand right before booking, so it doesn't
  # matter how stale the stored secret is — the booking always uses a new token.
  # Two entries to handle DST:
  #   EST (Nov-Mar): 11:00 PM ET = 04:00 UTC next day
  #   EDT (Mar-Nov): 11:00 PM ET = 03:00 UTC next day
  schedule:
    - cron: '0 4 * * 2-5'   # 11:00 PM EST (runs Tue-Fri UTC = Mon-Thu ET night)
    - cron: '0 3 * * 2-5'   # 11:00 PM EDT (runs Tue-Fri UTC = Mon-Thu ET night)

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      days_ahead:
        description: 'Days ahead to book (default: 7)'
        required: false
        default: '7'
        type: string
      start_time:
        description: 'Start time in ET (e.g., 11:00). Default: 9:30'
        required: false
        default: ''
        type: string
      end_time:
        description: 'End time in ET (e.g., 17:00). Default: 17:30'
        required: false
        default: ''
        type: string
      force:
        description: 'Force booking (skip existing reservation check)'
        required: false
        default: 'false'
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  book-desk:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.1

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium --with-deps

      # Mint a brand-new token right before booking (headless re-auth via the
      # stored Okta session). Exports it to GITHUB_ENV for the booking step.
      - name: Mint fresh Appspace token
        id: mint
        continue-on-error: true
        env:
          PLAYWRIGHT_AUTH_STATE: ${{ secrets.PLAYWRIGHT_AUTH_STATE }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$PLAYWRIGHT_AUTH_STATE" ]; then
            echo "No PLAYWRIGHT_AUTH_STATE secret — run refresh_token.py locally to seed it."
            exit 1
          fi
          python refresh_token.py --ci

      - name: Alert if token mint failed (Okta session expired)
        if: steps.mint.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "token-expired" --color "B60205" \
            --description "Appspace session token has expired, manual refresh needed" \
            --repo ${{ github.repository }} 2>/dev/null || true
          EXISTING=$(gh issue list --label "token-expired" --state open \
            --json number --repo ${{ github.repository }} -q '.[0].number' 2>/dev/null)
          if [ -z "$EXISTING" ]; then
            BODY="On-demand token mint failed during booking — the Okta session in PLAYWRIGHT_AUTH_STATE has expired.\n\nRun locally to heal it:\n\`\`\`\ncd ~/Documents/GitHub/appspace-desk-booker\npython refresh_token.py\n\`\`\`\nApprove the Okta push. This re-seeds PLAYWRIGHT_AUTH_STATE so future headless mints work again.\n\nThis issue closes automatically once a mint succeeds."
            gh issue create \
              --title "Appspace token mint failed — manual Okta re-auth required" \
              --label "token-expired" \
              --repo ${{ github.repository }} \
              --body "$BODY"
          fi
          echo "::error::Token mint failed — cannot book. See token-expired issue."
          exit 1

      - name: Close stale token-expired issue (mint succeeded)
        if: steps.mint.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label "token-expired" --state open \
            --json number --repo ${{ github.repository }} -q '.[0].number' 2>/dev/null)
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo ${{ github.repository }} \
              --comment "✅ Token mint succeeded — healed automatically. Closing."
          fi

      - name: Book desk
        run: |
          ARGS="--days-ahead ${{ inputs.days_ahead || '7' }}"
          if [ -n "${{ inputs.start_time }}" ]; then
            ARGS="$ARGS --start-time ${{ inputs.start_time }}"
          fi
          if [ -n "${{ inputs.end_time }}" ]; then
            ARGS="$ARGS --end-time ${{ inputs.end_time }}"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python book_desk.py $ARGS

      - name: Summary
        if: always()
        run: |
          echo "## 🏢 Desk Booking Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Desk**: 08W-125-G (7 Hudson, 8th Floor)" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: 9:30 AM - 5:30 PM ET" >> $GITHUB_STEP_SUMMARY
          echo "- **Run time**: $(TZ='America/New_York' date '+%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY
