name: Book Desk Daily

on:
  # Run at 11:00 PM ET, Monday-Thursday (to book 7 days out for Mon-Thu).
  # Fully unattended: book_desk.py mints a fresh session token from the
  # long-lived refresh token over plain HTTP — no browser, no Okta, no login.
  # Two entries to handle DST:
  #   EST (Nov-Mar): 11:00 PM ET = 04:00 UTC next day
  #   EDT (Mar-Nov): 11:00 PM ET = 03:00 UTC next day
  schedule:
    - cron: '0 4 * * 2-5'   # 11:00 PM EST (runs Tue-Fri UTC = Mon-Thu ET night)
    - cron: '0 3 * * 2-5'   # 11:00 PM EDT (runs Tue-Fri UTC = Mon-Thu ET night)

  workflow_dispatch:
    inputs:
      days_ahead:
        description: 'Days ahead to book (default: 7)'
        required: false
        default: '7'
        type: string
      start_time:
        description: 'Start time in ET (e.g., 11:00). Default: 9:30'
        required: false
        default: ''
        type: string
      end_time:
        description: 'End time in ET (e.g., 17:00). Default: 17:30'
        required: false
        default: ''
        type: string
      force:
        description: 'Force booking (skip existing reservation check)'
        required: false
        default: 'false'
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  book-desk:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.1

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Book desk
        id: book
        env:
          APPSPACE_REFRESH_TOKEN: ${{ secrets.APPSPACE_REFRESH_TOKEN }}
        run: |
          ARGS="--days-ahead ${{ inputs.days_ahead || '7' }}"
          if [ -n "${{ inputs.start_time }}" ]; then ARGS="$ARGS --start-time ${{ inputs.start_time }}"; fi
          if [ -n "${{ inputs.end_time }}" ]; then ARGS="$ARGS --end-time ${{ inputs.end_time }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          set +e
          python book_desk.py $ARGS
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit $CODE

      # Exit code 2 from book_desk.py == auth failure (refresh token expired/revoked).
      # Other failures (e.g. someone else grabbed the desk) must NOT open a reauth issue.
      - name: Alert if refresh token expired
        if: always() && steps.book.outputs.code == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "token-expired" --color "B60205" \
            --description "Appspace refresh token expired — yearly re-auth needed" \
            --repo ${{ github.repository }} 2>/dev/null || true
          EXISTING=$(gh issue list --label "token-expired" --state open \
            --json number --repo ${{ github.repository }} -q '.[0].number' 2>/dev/null)
          if [ -z "$EXISTING" ]; then
            BODY="Booking failed. If the log shows AUTH FAILURE, the refresh token expired or was revoked (it lasts ~365 days).\n\nRun once locally to mint a new one:\n\`\`\`\ncd ~/Documents/GitHub/appspace-desk-booker\npython refresh_token.py\n\`\`\`\nApprove the Okta push. The script stores a fresh APPSPACE_REFRESH_TOKEN and everything is unattended again for another year."
            gh issue create \
              --title "Appspace refresh token expired — yearly re-auth required" \
              --label "token-expired" --repo ${{ github.repository }} --body "$BODY"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## 🏢 Desk Booking Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Desk**: 08W-125-G (7 Hudson, 8th Floor)" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: 9:30 AM - 5:30 PM ET" >> $GITHUB_STEP_SUMMARY
          echo "- **Run time**: $(TZ='America/New_York' date '+%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_STEP_SUMMARY
