name: Keep Session Alive

on:
  # Run every hour to prevent idle session token expiry
  # (every 2h was too infrequent — GitHub cron delays could push pings past Appspace's idle TTL)
  schedule:
    - cron: '0 * * * *'

  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger (optional)'
        required: false
        default: 'manual check'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Appspace API
        env:
          APPSPACE_SESSION_TOKEN: ${{ secrets.APPSPACE_SESSION_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Capture response headers — Appspace may rotate the session token on
          # each authenticated call via Set-Cookie. If we throw the headers away
          # (the old -o /dev/null approach) we keep using the original token until
          # it hits its hard ~90-min TTL, causing unnecessary full re-auths.
          HTTP_CODE=$(curl -s -D /tmp/resp_headers.txt -o /tmp/resp_body.txt \
            -w "%{http_code}" \
            -H "Accept: application/json" \
            -H "token: $APPSPACE_SESSION_TOKEN" \
            "https://disney.cloud.appspace.com/api/v3/users/me")

          echo "API response: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Session is alive"

            # Check if Appspace issued a rotated token in the response
            NEW_TOKEN=$(grep -i "set-cookie.*appspace-session-token=" /tmp/resp_headers.txt 2>/dev/null \
              | sed 's/.*appspace-session-token=\([^;[:space:]]*\).*/\1/' \
              | tr -d '\r\n' | head -1)

            if [ -n "$NEW_TOKEN" ] && [ "$NEW_TOKEN" != "$APPSPACE_SESSION_TOKEN" ]; then
              echo "🔄 Token was rotated in response — updating secret to stay ahead of expiry"
              echo "$NEW_TOKEN" | gh secret set APPSPACE_SESSION_TOKEN \
                --repo ${{ github.repository }}
              echo "  ✓ APPSPACE_SESSION_TOKEN updated with rotated token"
            else
              echo "  (no token rotation in response headers)"
            fi

            exit 0
          fi

          echo "❌ Session is dead (HTTP $HTTP_CODE)"
          exit 1

  # When the token is dead, attempt headless Playwright re-auth using stored Okta cookies.
  # This works as long as the Okta session (stored in PLAYWRIGHT_AUTH_STATE) is still valid.
  # If it fails, open a GitHub Issue to prompt manual refresh.
  auto-refresh:
    runs-on: ubuntu-latest
    needs: keep-alive
    if: always() && needs.keep-alive.result == 'failure'
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.1

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Attempt headless token refresh
        id: headless-refresh
        env:
          PLAYWRIGHT_AUTH_STATE: ${{ secrets.PLAYWRIGHT_AUTH_STATE }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        continue-on-error: true
        run: |
          if [ -z "$PLAYWRIGHT_AUTH_STATE" ]; then
            echo "No PLAYWRIGHT_AUTH_STATE secret found."
            echo "Run refresh_token.py locally to seed this secret, then headless CI re-auth will work."
            exit 1
          fi
          python refresh_token.py --ci

      - name: Create GitHub Issue if headless refresh also failed
        if: steps.headless-refresh.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the label if it doesn't exist yet
          gh label create "token-expired" --color "B60205" \
            --description "Appspace session token has expired, manual refresh needed" \
            --repo ${{ github.repository }} 2>/dev/null || true

          # Only open one issue at a time
          EXISTING=$(gh issue list \
            --label "token-expired" \
            --state open \
            --json number \
            --repo ${{ github.repository }} \
            -q '.[0].number' 2>/dev/null)

          if [ -z "$EXISTING" ]; then
            BODY="Token expired and headless re-auth failed (Okta session likely expired too).\n\nRun locally:\n\`\`\`\ncd ~/Documents/GitHub/appspace-desk-booker\npython refresh_token.py\n\`\`\`\nApprove the Okta push. Script updates APPSPACE_SESSION_TOKEN and PLAYWRIGHT_AUTH_STATE automatically.\n\nThis issue closes automatically once keep-alive passes."
            gh issue create \
              --title "Appspace session token expired — manual refresh required" \
              --label "token-expired" \
              --repo ${{ github.repository }} \
              --body "$BODY"
          else
            echo "Issue #$EXISTING already open — skipping duplicate"
          fi

  # Close any stale token-expired issue when the token recovers
  close-issue:
    runs-on: ubuntu-latest
    needs: keep-alive
    if: always() && needs.keep-alive.result == 'success'
    permissions:
      issues: write
    steps:
      - name: Close stale token-expired issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list \
            --label "token-expired" \
            --state open \
            --json number \
            --repo ${{ github.repository }} \
            -q '.[0].number' 2>/dev/null)

          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" \
              --repo ${{ github.repository }} \
              --comment "✅ Token is healthy again — closing automatically."
            echo "Closed issue #$EXISTING"
          fi
